<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>ai.itemlab | 관리자</title><link rel="stylesheet" href="./styles.css"/><style>body.admin-page{background:#f5f7fb;color:#10131a}.admin-page .site-header{color:#10131a;background:rgba(255,255,255,.94);box-shadow:0 1px 20px rgba(17,24,39,.08)}.admin-shell{padding:128px clamp(20px,5vw,72px) 96px}.admin-login{width:min(620px,100%);margin:0 auto}.admin-login .section-head h1,.admin-dashboard-head h1{margin:0;font-size:clamp(34px,5vw,64px);line-height:1.08}.admin-card{border:1px solid #e5e9f0;border-radius:8px;background:#fff;box-shadow:0 22px 60px rgba(17,24,39,.13)}.admin-login-form,.admin-editor{display:grid;gap:16px;padding:28px}.admin-login-form label,.admin-editor label{display:grid;gap:8px;color:#10131a;font-weight:900}.admin-page input,.admin-page select,.admin-page textarea{width:100%;min-height:48px;padding:13px 14px;color:#10131a;border:1px solid #e5e9f0;border-radius:7px;background:#fff;font:inherit}.admin-page textarea{resize:vertical}.admin-message{min-height:22px;margin:0;color:#697180;line-height:1.5}.admin-message.is-error{color:#d93025}.admin-dashboard.is-hidden,.admin-login.is-hidden{display:none}.admin-dashboard-head{width:min(1180px,100%);margin:0 auto 28px;display:flex;align-items:end;justify-content:space-between;gap:20px}.admin-dashboard-head p{max-width:660px;color:#697180;line-height:1.75}.admin-layout{width:min(1180px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(320px,.78fr) minmax(0,1.22fr);gap:18px;align-items:start}.admin-preview{min-height:210px;display:grid;place-items:center;overflow:hidden;color:#697180;border:1px dashed #e5e9f0;border-radius:8px;background:#f5f7fb}.admin-preview img{width:100%;height:260px;object-fit:cover}.admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-list{padding:24px}.admin-list-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.admin-list-head h2{margin:0;font-size:24px}.admin-items{display:grid;gap:12px}.admin-empty{margin:0;padding:30px;color:#697180;text-align:center;border:1px dashed #e5e9f0;border-radius:8px;background:#f5f7fb}.admin-item{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px;border:1px solid #e5e9f0;border-radius:8px}.admin-item img{width:112px;height:84px;object-fit:cover;border-radius:7px;background:#f5f7fb}.admin-item h3{margin:0 0 6px;font-size:18px}.admin-item p{margin:0;color:#697180;line-height:1.5}.admin-item-actions{display:flex;gap:8px}.admin-mini-button{min-height:36px;padding:0 12px;color:#10131a;border:1px solid #e5e9f0;border-radius:7px;background:#fff;font-weight:900;cursor:pointer}.admin-mini-button.danger{color:#d93025}@media(max-width:960px){.admin-layout{grid-template-columns:1fr}.admin-dashboard-head{align-items:stretch;flex-direction:column}.admin-item{grid-template-columns:88px minmax(0,1fr)}.admin-item img{width:88px;height:72px}.admin-item-actions{grid-column:1/-1}}@media(max-width:640px){.admin-shell{padding-left:16px;padding-right:16px}.admin-login-form,.admin-editor,.admin-list{padding:22px}.admin-actions{grid-template-columns:1fr}}</style></head><body class="admin-page"><header class="site-header is-scrolled" data-header><a class="brand" href="./index.html" aria-label="ai.itemlab 홈"><span class="brand-mark">ai</span><span>ai.itemlab</span></a><button class="menu-button" type="button" aria-label="메뉴 열기" aria-expanded="false" data-menu-button><span></span><span></span><span></span></button><nav class="nav" data-nav><a href="./index.html#services">제작분야</a><a href="./portfolio.html">포트폴리오</a><a class="is-active" href="./admin.html">관리자</a><a class="nav-cta" href="./index.html#contact">제작문의</a></nav></header><main class="admin-shell"><section class="admin-login" data-admin-login><div class="section-head reveal"><p class="eyebrow">Admin Login</p><h1>관리자 페이지</h1><p>아이디와 비밀번호를 입력하면 포트폴리오 -admin-items></div></div></div></section></main><script src="./script.js"></script></body></html>
